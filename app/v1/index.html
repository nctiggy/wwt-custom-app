<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WWT Gas — Station Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="/images/logo.png" alt="WWT Logo" class="logo-mark">
      <div class="logo-text">Gas</div>
      <div class="header-divider"></div>
      <div class="header-subtitle">Station Monitor</div>
    </div>
    <div class="header-right">
      <span class="station-id">Station #1247</span>
      <span class="version-pill v1">v1.0</span>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-icon">⛽</div>
      <div class="stat-value" id="available-count">8</div>
      <div class="stat-label">Available</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-icon">⏱️</div>
      <div class="stat-value" id="avg-time">0:00</div>
      <div class="stat-label">Avg Time</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-icon">🚗</div>
      <div class="stat-value" id="cars-served">0</div>
      <div class="stat-label">Cars Served</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-icon">💵</div>
      <div class="stat-value revenue" id="revenue">$0</div>
      <div class="stat-label">Revenue</div>
    </div>
  </div>

  <div class="main v1-layout">
    <div class="pump-section">
      <div class="section-label">Fuel Pumps</div>
      <div class="pump-grid" id="pump-grid"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <div class="status-dot online"></div>
      <span>System Online</span>
    </div>
    <div class="footer-right">
      <span class="powered-by">Powered by <span>WWT</span> &amp; Spectro Cloud Palette</span>
    </div>
  </div>

  <script>
    // State management
    const state = {
      pumps: Array.from({ length: 8 }, (_, i) => ({
        id: i + 1,
        status: 'available',
        elapsedTime: 0,
        startTime: null
      })),
      completedTimes: [],
      carsServed: 0,
      revenue: 0
    };

    // Format seconds as M:SS
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Toggle pump status
    function togglePump(pumpId) {
      const pump = state.pumps.find(p => p.id === pumpId);
      if (!pump) return;

      if (pump.status === 'available') {
        // Start occupation
        pump.status = 'occupied';
        pump.startTime = Date.now();
        pump.elapsedTime = 0;
      } else {
        // End occupation
        if (pump.elapsedTime > 0) {
          state.completedTimes.push(pump.elapsedTime);
          state.carsServed++;
          // Add random revenue between $25-65
          const sale = Math.floor(Math.random() * 41) + 25;
          state.revenue += sale;
        }
        pump.status = 'available';
        pump.startTime = null;
        pump.elapsedTime = 0;
      }

      render();
    }

    // Update pump timers
    function updateTimers() {
      const now = Date.now();
      state.pumps.forEach(pump => {
        if (pump.status !== 'available' && pump.startTime) {
          pump.elapsedTime = Math.floor((now - pump.startTime) / 1000);

          // Update status based on elapsed time
          if (pump.elapsedTime >= 420) {
            pump.status = 'critical';
          } else if (pump.elapsedTime >= 300) {
            pump.status = 'warning';
          } else if (pump.status === 'warning' || pump.status === 'critical') {
            pump.status = 'occupied';
          }
        }
      });
    }

    // Calculate average time
    function calculateAvgTime() {
      if (state.completedTimes.length === 0) return 0;
      const sum = state.completedTimes.reduce((a, b) => a + b, 0);
      return Math.floor(sum / state.completedTimes.length);
    }

    // Get status icon
    function getStatusIcon(status) {
      switch (status) {
        case 'available': return '✓';
        case 'occupied': return '●';
        case 'warning': return '⚠️';
        case 'critical': return '⚠️';
        default: return '●';
      }
    }

    // Get status label
    function getStatusLabel(status) {
      switch (status) {
        case 'available': return 'Available';
        case 'occupied': return 'In Use';
        case 'warning': return 'Long Wait';
        case 'critical': return 'Critical';
        default: return 'Unknown';
      }
    }

    // Render UI
    function render() {
      // Update stats bar
      const availableCount = state.pumps.filter(p => p.status === 'available').length;
      document.getElementById('available-count').textContent = `${availableCount}/8`;
      document.getElementById('avg-time').textContent = formatTime(calculateAvgTime());
      document.getElementById('cars-served').textContent = state.carsServed;
      document.getElementById('revenue').textContent = `$${state.revenue.toLocaleString()}`;

      // Render pump grid
      const grid = document.getElementById('pump-grid');
      grid.innerHTML = state.pumps.map(pump => `
        <div class="pump ${pump.status}" onclick="togglePump(${pump.id})">
          <div class="pump-number">${pump.id}</div>
          <div class="pump-status-icon">${getStatusIcon(pump.status)}</div>
          <div class="pump-timer">${formatTime(pump.elapsedTime)}</div>
          <div class="pump-label">${getStatusLabel(pump.status)}</div>
        </div>
      `).join('');
    }

    // Main update loop
    function update() {
      updateTimers();
      render();
    }

    // Initialize
    render();
    setInterval(update, 1000);
  </script>
</body>
</html>
