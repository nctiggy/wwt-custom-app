<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WWT Gas — Station Monitor</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="/images/logo.png" class="logo-mark" alt="WWT">
      <span class="logo-text">Gas</span>
      <div class="header-divider"></div>
      <div class="header-subtitle">Station Monitor</div>
    </div>
    <div class="header-right">
      <span class="station-id">Station #1247</span>
      <span class="version-pill v1">v1.0</span>
    </div>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-icon">⛽</span>
      <span class="stat-value good" id="available-count">8</span>
      <span class="stat-label">/ 8 Available</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-icon">⏱</span>
      <span class="stat-value" id="avg-time">0:00</span>
      <span class="stat-label">Avg Time</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-icon">🚗</span>
      <span class="stat-value" id="cars-served">0</span>
      <span class="stat-label">Served Today</span>
    </div>
  </div>

  <!-- Pump Grid -->
  <div class="main v1-layout">
    <div class="pump-section">
      <div class="section-label">Tap pump to toggle status</div>
      <div class="pump-grid" id="pump-grid">
        <!-- Pumps generated by JS -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-left">
      <span class="status-dot online"></span>
      <span>System Online</span>
    </div>
    <div class="footer-right">
      <span class="powered-by">Powered by <span>WWT</span> &amp; Spectro Cloud Palette</span>
    </div>
  </div>

<script>
(function() {
  'use strict';

  const PUMP_COUNT = 8;
  const WARNING_THRESHOLD = 300;  // 5 min
  const CRITICAL_THRESHOLD = 420; // 7 min

  // State
  const pumps = [];
  let carsServed = 0;
  let completedTimes = [];

  // Init pumps
  for (let i = 1; i <= PUMP_COUNT; i++) {
    pumps.push({ id: i, status: 'available', startTime: null, elapsed: 0 });
  }

  // Render pump grid
  const grid = document.getElementById('pump-grid');
  pumps.forEach(pump => {
    const el = document.createElement('div');
    el.className = 'pump available';
    el.dataset.id = pump.id;
    el.innerHTML = `
      <span class="pump-number">Pump ${pump.id}</span>
      <span class="pump-status-icon">⛽</span>
      <span class="pump-timer">—</span>
      <span class="pump-label">Available</span>
    `;
    el.addEventListener('click', () => togglePump(pump.id));
    grid.appendChild(el);
  });

  function togglePump(id) {
    const pump = pumps.find(p => p.id === id);
    if (pump.status === 'available') {
      pump.status = 'occupied';
      pump.startTime = Date.now();
      pump.elapsed = 0;
    } else {
      // Complete the pump session
      if (pump.elapsed > 0) {
        completedTimes.push(pump.elapsed);
        carsServed++;
      }
      pump.status = 'available';
      pump.startTime = null;
      pump.elapsed = 0;
    }
    render();
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function render() {
    pumps.forEach(pump => {
      const el = grid.querySelector(`[data-id="${pump.id}"]`);
      if (!el) return;

      if (pump.status !== 'available' && pump.startTime) {
        pump.elapsed = (Date.now() - pump.startTime) / 1000;

        if (pump.elapsed >= CRITICAL_THRESHOLD) {
          pump.status = 'critical';
        } else if (pump.elapsed >= WARNING_THRESHOLD) {
          pump.status = 'warning';
        } else {
          pump.status = 'occupied';
        }
      }

      el.className = `pump ${pump.status}`;

      const icon = el.querySelector('.pump-status-icon');
      const timer = el.querySelector('.pump-timer');
      const label = el.querySelector('.pump-label');

      if (pump.status === 'available') {
        icon.textContent = '⛽';
        timer.textContent = '—';
        label.textContent = 'Available';
      } else if (pump.status === 'occupied') {
        icon.textContent = '🚗';
        timer.textContent = formatTime(pump.elapsed);
        label.textContent = 'Occupied';
      } else if (pump.status === 'warning') {
        icon.textContent = '⚠️';
        timer.textContent = formatTime(pump.elapsed);
        label.textContent = 'Overstay';
      } else if (pump.status === 'critical') {
        icon.textContent = '🚨';
        timer.textContent = formatTime(pump.elapsed);
        label.textContent = 'Alert';
      }
    });

    // Update stats
    const available = pumps.filter(p => p.status === 'available').length;
    const availEl = document.getElementById('available-count');
    availEl.textContent = available;
    availEl.className = `stat-value ${available > 4 ? 'good' : available > 2 ? 'warn' : 'bad'}`;

    document.getElementById('cars-served').textContent = carsServed;

    // Avg time from completed sessions
    if (completedTimes.length > 0) {
      const avg = completedTimes.reduce((a, b) => a + b, 0) / completedTimes.length;
      document.getElementById('avg-time').textContent = formatTime(avg);
    }
  }

  // Tick every second
  setInterval(render, 1000);
  render();
})();
</script>
</body>
</html>
