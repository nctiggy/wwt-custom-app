name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'css/**'
      - 'inference/**'
      - '.github/workflows/release.yml'

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push v1
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          build-args: APP_VERSION=v1
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nctiggy/wwt-custom-app:1.0.0

      - name: Build and push v2
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          build-args: APP_VERSION=v2
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nctiggy/wwt-custom-app:2.0.0

      - name: Build and push GPU inference backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inference/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nctiggy/wwt-gpu-inference:1.0.0
